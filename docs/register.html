<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CyberShield Ghana</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">🛡️ Cyber<span>Shield</span> Ghana</a>
    <div class="nav-actions">
      <a class="btn btn-outline" href="login.html">Login</a>
      <a class="btn btn-primary" href="register.html">Register</a>
    </div>
  </header>

  <main>
    <div class="auth-wrap" style="max-width:460px;">
      <div id="flash" class="alert d-none"></div>
      <div class="card" style="padding:1.5rem;">
        <h3 style="text-align:center;margin-bottom:1.25rem;">📝 Create Account</h3>
        <form id="registerForm">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Phone Number</label>
              <input type="text" id="regPhone">
            </div>
            <div class="form-group">
              <label>Age</label>
              <input type="number" id="regAge" min="1" max="120">
            </div>
          </div>
          <div class="form-group">
            <label>Organisation (Optional)</label>
            <input type="text" id="regOrganisation">
          </div>
          <div class="form-group">
            <label>Location (Optional)</label>
            <input type="text" id="regLocation">
          </div>
          <div class="form-group">
            <label>Password <span class="small text-muted">(min. 8 characters)</span></label>
            <input type="password" id="regPassword" minlength="8" required>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="regPassword2" required>
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="registerBtn">Create Account</button>
        </form>
        <hr style="border-color:var(--border-light);margin:1rem 0;">
        <p class="small" style="text-align:center;margin-bottom:0;">Already have an account? <a href="login.html">Login here</a></p>
      </div>
    </div>
  </main>

  <div class="footer">
    CyberShield Ghana &mdash; Independent application for facilitating reporting to the Cyber Security Authority (CSA).<br>
    This is not an official CSA application. <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Use</a>
  </div>

  <script type="module">
    import { auth, db, redirectIfSignedIn, showFlash } from "./js/common.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    redirectIfSignedIn();

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim().toLowerCase();
      const password = document.getElementById("regPassword").value;
      const confirmPassword = document.getElementById("regPassword2").value;

      if (password !== confirmPassword) {
        showFlash("Passwords do not match.", "error");
        return;
      }

      const btn = document.getElementById("registerBtn");
      btn.disabled = true;
      btn.textContent = "Creating account...";

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", email), {
          email,
          full_name: name,
          phone: document.getElementById("regPhone").value.trim(),
          age: parseInt(document.getElementById("regAge").value) || null,
          location: document.getElementById("regLocation").value.trim(),
          organisation: document.getElementById("regOrganisation").value.trim(),
          role: "user",
          account_status: "active",
          email_verified: false,
          auth_uid: cred.user.uid,
          created_at: new Date(),
          updated_at: new Date()
        });
        window.location.replace("dashboard.html");
      } catch (err) {
        showFlash(friendlyError(err), "error");
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });

    function friendlyError(err) {
      const map = {
        "auth/email-already-in-use": "An account with this email already exists.",
        "auth/weak-password": "Password must be at least 8 characters.",
        "auth/invalid-email": "Please enter a valid email address.",
        "auth/too-many-requests": "Too many attempts. Please try again later."
      };
      return map[err.code] || (err.message || "Something went wrong.");
    }
  </script>
</body>
</html>
