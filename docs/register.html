<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CyberShield Ghana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme-light.css">
  <script>
    (function () {
      try {
        if (localStorage.getItem('cs-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">🛡️ Cyber<span>Shield</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <button class="theme-toggle nav-link ms-auto" type="button" aria-label="Toggle light/dark theme" title="Toggle theme">🌙</button>
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-6">
        <div id="flash" class="alert d-none"></div>
        <div class="card p-4">
          <h3 class="text-center mb-4">📝 Create Account</h3>
          <form id="registerForm">
            <div class="mb-3">
              <label for="regName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="regName" required autofocus>
            </div>
            <div class="mb-3">
              <label for="regEmail" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="regEmail" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="regPhone" class="form-label">Phone (optional)</label>
                <input type="text" class="form-control" id="regPhone">
              </div>
              <div class="col-md-6 mb-3">
                <label for="regAge" class="form-label">Age (optional)</label>
                <input type="number" class="form-control" id="regAge" min="1" max="120">
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="regLocation" class="form-label">Location (optional)</label>
                <input type="text" class="form-control" id="regLocation">
              </div>
              <div class="col-md-6 mb-3">
                <label for="regOrganisation" class="form-label">Organisation (optional)</label>
                <input type="text" class="form-control" id="regOrganisation">
              </div>
            </div>
            <div class="mb-3">
              <label for="regPassword" class="form-label">Password (min 8 characters)</label>
              <input type="password" class="form-control" id="regPassword" minlength="8" required>
              <div id="pwnedCheck" class="small mt-1"></div>
            </div>
            <div class="mb-3">
              <label for="regPassword2" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="regPassword2" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2" id="registerBtn">Create Account</button>
          </form>
          <hr>
          <p class="text-center mb-0">Already have an account? <a href="login.html">Login here</a></p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p class="mb-0"><a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Use</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { auth, showFlash } from "./js/common.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ---------- Pwned Passwords (Have I Been Pwned range API, no key) ----------
    // Sends only the first 5 chars of the SHA-1 hash (k-anonymity), so the
    // password itself never leaves the browser.
    async function sha1Hex(str) {
      const buf = new TextEncoder().encode(str);
      const hash = await crypto.subtle.digest("SHA-1", buf);
      return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, "0")).join("");
    }

    let pwnedTimer = null;
    async function checkPwned(pw) {
      const out = document.getElementById("pwnedCheck");
      if (!pw || pw.length < 8) { if (out) out.innerHTML = ""; return; }
      if (out) out.innerHTML = '<span class="text-muted">Checking against known breaches…</span>';
      try {
        const hash = await sha1Hex(pw);
        const prefix = hash.slice(0, 5).toUpperCase();
        const suffix = hash.slice(5).toUpperCase();
        const r = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
        if (!r.ok) throw new Error("breach check unavailable");
        const text = await r.text();
        const found = text.split(/\r?\n/).some(line => line.split(":")[0] === suffix);
        if (found) {
          out.innerHTML = '<span class="text-danger">⚠️ This password appears in known data breaches — please choose a different one.</span>';
        } else {
          out.innerHTML = '<span class="text-success">✅ This password was not found in known breaches.</span>';
        }
      } catch (e) {
        if (out) out.innerHTML = '<span class="text-muted">Breach check unavailable right now.</span>';
      }
    }

    document.getElementById("regPassword").addEventListener("input", (e) => {
      clearTimeout(pwnedTimer);
      const v = e.target.value;
      pwnedTimer = setTimeout(() => checkPwned(v), 700);
    });
    import { db } from "./js/common.js";

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim().toLowerCase();
      const p1 = document.getElementById("regPassword").value;
      const p2 = document.getElementById("regPassword2").value;
      if (p1 !== p2) return showFlash("Passwords do not match.", "error");
      const btn = document.getElementById("registerBtn");
      btn.disabled = true; btn.textContent = "Creating account...";
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, p1);
        await setDoc(doc(db, "users", email), {
          email: email,
          full_name: name,
          phone: document.getElementById("regPhone").value.trim(),
          age: parseInt(document.getElementById("regAge").value) || null,
          location: document.getElementById("regLocation").value.trim(),
          organisation: document.getElementById("regOrganisation").value.trim(),
          role: "user",
          account_status: "active",
          email_verified: false,
          auth_uid: cred.user.uid,
          created_at: new Date(),
          updated_at: new Date()
        });
        window.location.replace("dashboard.html");
      } catch (err) {
        showFlash(friendlyError(err), "error");
        btn.disabled = false; btn.textContent = "Create Account";
      }
    });

    function friendlyError(err) {
      const map = {
        "auth/email-already-in-use": "An account with this email already exists. Try logging in.",
        "auth/weak-password": "Password must be at least 8 characters.",
        "auth/invalid-email": "Please enter a valid email address."
      };
      return map[err.code] || (err.message || "Something went wrong.");
    }
  </script>
  <script>
    (function () {
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;
      function sync() {
        btn.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '☀️' : '🌙';
      }
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        if (root.getAttribute('data-theme') === 'light') {
          root.removeAttribute('data-theme');
          localStorage.setItem('cs-theme', 'dark');
        } else {
          root.setAttribute('data-theme', 'light');
          localStorage.setItem('cs-theme', 'light');
        }
        sync();
      });
      sync();
    })();
  </script>
</body>
</html>
