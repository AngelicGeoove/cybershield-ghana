<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Safe - CyberShield Ghana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="container py-4">
    <h2 class="mb-1">🛡️ Stay Safe Online</h2>
    <p class="text-muted mb-4">Practical tips from the Cyber Security Authority of Ghana to keep you protected.</p>
    <div class="row" id="tips"></div>
  </main>
  <footer>
    <div class="container">
      <p class="mb-0"><a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Use</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { requireAuth, renderNav, esc } from "./js/common.js";
    requireAuth(() => renderNav("awareness.html"));

    const TIPS = [
      ["Use strong, unique passwords", "Use at least 12 characters with a mix of letters, numbers and symbols. Never reuse the same password across sites."],
      ["Turn on two-factor authentication", "Enable 2FA on email, banking and mobile money apps. It blocks most account-takeover attempts."],
      ["Beware of unsolicited links", "Never click links in unexpected SMS or WhatsApp messages, even if they look like they come from your bank or network."],
      ["Never share your PIN or OTP", "No legitimate organisation - including the CSA, banks, or telecoms - will ever ask for your PIN or one-time password."],
      ["Verify before you pay", "For online shopping, use trusted platforms and verify seller reviews before making payments."],
      ["Update your devices", "Keep phones and computers updated. Updates patch security holes that criminals exploit."],
      ["Watch for urgency and fear tactics", "Scammers create panic ('your account will be blocked!') to rush you. Stop, verify, and never act under pressure."],
      ["Protect your social media", "Use private accounts, approve friend requests carefully, and avoid sharing your location or daily routines publicly."],
      ["Beware of fake investment offers", "If a 'business opportunity' promises unrealistically high returns, it is almost certainly a scam."],
      ["Secure your Wi-Fi", "Use WPA2/WPA3 encryption and a strong router password. Do not use public Wi-Fi for banking."],
      ["Sextortion awareness", "Never share intimate images. If someone threatens to leak them, do not pay - report it to the CSA immediately."],
      ["Report promptly", "The sooner you report, the better the chance of recovering money or stopping further harm."]
    ];

    document.getElementById("tips").innerHTML = TIPS.map(([t, d]) => `
      <div class="col-md-6 col-lg-4 mb-4">
        <div class="feature-card p-4">
          <div class="feature-icon">🛡️</div>
          <h5>${esc(t)}</h5>
          <p class="text-muted small mb-0">${esc(d)}</p>
        </div>
      </div>`).join("");
  </script>
</body>
</html>
