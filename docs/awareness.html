<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Safe - CyberShield Ghana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme-light.css">
  <script>
    (function () {
      try {
        if (localStorage.getItem('cs-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="navbar"></div>
  <main class="container py-4">
    <h2 class="mb-1">🛡️ Stay Safe Online</h2>
    <p class="text-muted mb-4">Practical tips from the Cyber Security Authority of Ghana to keep you protected. Click any topic to learn more.</p>
    <div class="row" id="tips"></div>
  </main>

  <!-- Topic detail modal -->
  <div class="modal fade" id="topicModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="topicModalLabel"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="topicModalBody"></div>
        <div class="modal-footer">
          <a href="report.html" class="btn btn-report">Report an Incident</a>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
  <footer>
    <div class="container">
      <p class="mb-0"><a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Use</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/awareness-topics.js"></script>
  <script type="module">
    import { requireAuth, renderNav, esc } from "./js/common.js";
    requireAuth(() => renderNav("awareness.html"));

    const topics = Object.entries(window.AWARENESS_TOPICS || {});

    document.getElementById("tips").innerHTML = topics.map(([key, t]) => `
      <div class="col-md-6 col-lg-4 mb-4">
        <div class="feature-card p-4 topic-card" style="cursor:pointer" onclick="openTopic('${esc(key)}')">
          <div class="feature-icon">${t.icon || '🛡️'}</div>
          <h5>${esc(t.title)}</h5>
          <p class="text-muted small mb-0">${esc((t.what || "").slice(0, 120))}...</p>
          <span class="small text-primary mt-2 d-inline-block">Learn more →</span>
        </div>
      </div>`).join("");

    window.openTopic = (key) => {
      const t = (window.AWARENESS_TOPICS || {})[key];
      if (!t) return;
      const li = (items) => (items || []).map(i => `<li>${esc(i)}</li>`).join("");
      document.getElementById("topicModalLabel").innerHTML = `${t.icon || '🛡️'} ${esc(t.title)}`;
      document.getElementById("topicModalBody").innerHTML = `
        <div class="card p-3 mb-3">
          <h5>What is it?</h5>
          <p class="mb-0">${esc(t.what || "")}</p>
        </div>
        <div class="card p-3 mb-3">
          <h5>⚠️ Warning Signs</h5>
          <ul class="mb-0">${li(t.warning_signs)}</ul>
        </div>
        <div class="card p-3 mb-3">
          <h5>✅ What to do</h5>
          <ul class="mb-0">${li(t.what_to_do)}</ul>
        </div>
        <div class="card p-3 mb-3">
          <h5>🚫 What NOT to do</h5>
          <ul class="mb-0">${li(t.what_not_to_do)}</ul>
        </div>
        <div class="card p-3">
          <h5>📢 How to Report</h5>
          <p class="mb-0">${esc(t.how_to_report || "")}</p>
        </div>`;
      const modal = new bootstrap.Modal(document.getElementById("topicModal"));
      modal.show();
    };
  </script>
</body>
</html>
