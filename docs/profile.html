<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - CyberShield Ghana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme-light.css">
  <script>
    (function () {
      try {
        if (localStorage.getItem('cs-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="navbar"></div>
  <main class="container py-4">
    <h2 class="mb-4">👤 Your Profile</h2>
    <div id="flash" class="alert d-none"></div>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4">
          <form id="profileForm">
            <div class="mb-3">
              <label class="form-label">Full name</label>
              <input class="form-control" id="p_name" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input class="form-control" id="p_phone">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Age</label>
                <input type="number" class="form-control" id="p_age" min="1" max="120">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Location</label>
              <input class="form-control" id="p_location">
            </div>
            <div class="mb-3">
              <label class="form-label">Organisation</label>
              <input class="form-control" id="p_org">
            </div>
            <div class="mb-3">
              <label class="form-label">Email (cannot change)</label>
              <input class="form-control" id="p_email" disabled>
            </div>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <div class="container">
      <p class="mb-0"><a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Use</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { auth, db, requireAuth, renderNav, showFlash } from "./js/common.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    requireAuth((user) => {
      renderNav("profile.html");
      document.getElementById("p_email").value = user.email;
      getDoc(doc(db, "users", user.email.toLowerCase())).then(snap => {
        if (!snap.exists()) return;
        const d = snap.data();
        document.getElementById("p_name").value = d.full_name || "";
        document.getElementById("p_phone").value = d.phone || "";
        document.getElementById("p_age").value = d.age || "";
        document.getElementById("p_location").value = d.location || "";
        document.getElementById("p_org").value = d.organisation || "";
      });

      document.getElementById("profileForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        await setDoc(doc(db, "users", user.email.toLowerCase()), {
          full_name: document.getElementById("p_name").value.trim(),
          phone: document.getElementById("p_phone").value.trim(),
          age: parseInt(document.getElementById("p_age").value) || null,
          location: document.getElementById("p_location").value.trim(),
          organisation: document.getElementById("p_org").value.trim(),
          updated_at: new Date()
        }, { merge: true });
        showFlash("Profile updated.", "success");
      });
    });
  </script>
</body>
</html>
