<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CyberShield Ghana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">🛡️ Cyber<span>Shield</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link btn btn-report" href="register.html">Get Started</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-5">
        <div id="flash" class="alert d-none"></div>
        <div class="card p-4">
          <h3 class="text-center mb-4">🔐 Login</h3>
          <form id="loginForm">
            <div class="mb-3">
              <label for="loginEmail" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="loginEmail" required autofocus>
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="loginPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">Login</button>
          </form>
          <hr>
          <p class="text-center mb-1">
            Don't have an account? <a href="register.html">Register here</a>
          </p>
          <p class="text-center mb-0">
            <a href="#" id="forgotLink">Forgot password?</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row justify-content-center mt-4">
      <div class="col-md-5">
        <div class="card p-4 d-none" id="panelForgot">
          <h3 class="text-center mb-4">📧 Reset Password</h3>
          <form id="forgotForm">
            <div class="mb-3">
              <label for="forgotEmail" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="forgotEmail" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Send Reset Link</button>
          </form>
          <hr>
          <p class="text-center mb-0"><a href="#" id="backToLogin">Back to sign in</a></p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p class="mb-0"><a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Use</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { auth, redirectIfSignedIn, showFlash } from "./js/common.js";
    import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    redirectIfSignedIn();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      btn.disabled = true; btn.textContent = "Logging in...";
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("loginEmail").value.trim(),
          document.getElementById("loginPassword").value
        );
        window.location.replace("dashboard.html");
      } catch (err) {
        showFlash(friendlyError(err), "error");
        btn.disabled = false; btn.textContent = "Login";
      }
    });

    document.getElementById("forgotLink").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("panelForgot").classList.remove("d-none");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.getElementById("backToLogin").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("panelForgot").classList.add("d-none");
    });

    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await sendPasswordResetEmail(auth, document.getElementById("forgotEmail").value.trim());
        showFlash("Password reset link sent. Check your email.", "success");
        document.getElementById("panelForgot").classList.add("d-none");
      } catch (err) {
        showFlash(friendlyError(err), "error");
      }
    });

    function friendlyError(err) {
      const map = {
        "auth/user-not-found": "No account found with this email.",
        "auth/invalid-credential": "Incorrect email or password.",
        "auth/wrong-password": "Incorrect password.",
        "auth/too-many-requests": "Too many attempts. Please try again later.",
        "auth/invalid-email": "Please enter a valid email address."
      };
      return map[err.code] || (err.message || "Something went wrong.");
    }
  </script>
</body>
</html>
