<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - CyberShield Ghana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme-light.css">
  <script>
    (function () {
      try {
        if (localStorage.getItem('cs-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="navbar"></div>
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 id="greeting" class="mb-0">Welcome</h2>
      <a href="report.html" class="btn btn-report">+ New Report</a>
    </div>
    <div id="flash" class="alert d-none"></div>

    <div class="row mb-4" id="stats"></div>

    <div class="card mb-4" id="recentCard">
      <div class="card-header">Recently Submitted Report</div>
      <div class="card-body" id="recent"></div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <div class="card p-4 h-100">
          <h5>📝 Report Cyber Incident</h5>
          <p class="text-muted">Start a new cyber incident report by filling out the guided form step by step.</p>
          <a href="report.html" class="btn btn-primary mt-auto">Start Report</a>
        </div>
      </div>
      <div class="col-md-6 mb-3">
        <div class="card p-4 h-100">
          <h5>🛡️ Stay Safe Online</h5>
          <p class="text-muted">Practical cybersecurity tips from the Cyber Security Authority.</p>
          <a href="awareness.html" class="btn btn-outline-primary mt-auto">View Tips</a>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <div class="container">
      <p class="mb-0"><a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Use</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { auth, db, requireAuth, renderNav, fmtDay, statusBadge, esc } from "./js/common.js";
    import { collection, query, where, onSnapshot, doc, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    requireAuth((user) => {
      renderNav("dashboard.html");

      onSnapshot(doc(db, "users", user.email.toLowerCase()), (snap) => {
        if (snap.exists()) {
          const d = snap.data();
          const name = d.full_name ? d.full_name.split(" ")[0] : "friend";
          document.getElementById("greeting").textContent = `Welcome, ${esc(name)}`;
        }
      });

      const q = query(collection(db, "incidents"), where("user_email", "==", user.email.toLowerCase()), orderBy("created_at", "desc"), limit(50));
      onSnapshot(q, (snap) => {
        const incidents = [];
        snap.forEach(d => incidents.push({ id: d.id, ...d.data() }));

        const total = incidents.length;
        const awaiting = incidents.filter(i => i.status === "submitted" || i.status === "awaiting_confirmation").length;
        const submitted = incidents.filter(i => ["sent", "under_investigation", "evidence_requested", "resolved", "closed"].includes(i.status)).length;
        const drafts = incidents.filter(i => i.status === "draft").length;

        document.getElementById("stats").innerHTML = `
          <div class="col-md-3 mb-3">
            <div class="card stat-card">
              <div class="stat-number">${total}</div>
              <div class="stat-label">Total Reports</div>
            </div>
          </div>
          <div class="col-md-3 mb-3">
            <div class="card stat-card">
              <div class="stat-number">${awaiting}</div>
              <div class="stat-label">Awaiting Confirmation</div>
            </div>
          </div>
          <div class="col-md-3 mb-3">
            <div class="card stat-card">
              <div class="stat-number">${submitted}</div>
              <div class="stat-label">Successfully Submitted</div>
            </div>
          </div>
          <div class="col-md-3 mb-3">
            <div class="card stat-card">
              <div class="stat-number">${drafts}</div>
              <div class="stat-label">Drafts</div>
            </div>
          </div>`;

        const recent = document.getElementById("recent");
        if (!incidents.length) {
          document.getElementById("recentCard").classList.add("d-none");
        } else {
          const r = incidents[0];
          document.getElementById("recentCard").classList.remove("d-none");
          recent.innerHTML = `
            <p class="mb-1"><strong>Report ID:</strong> ${esc(r.id)}</p>
            <p class="mb-1"><strong>Category:</strong> ${esc(r.category)}</p>
            <p class="mb-1"><strong>Status:</strong> ${statusBadge(r.status)}</p>
            <p class="mb-3"><strong>Date:</strong> ${fmtDay(r.created_at)}</p>
            <a href="reports.html?id=${encodeURIComponent(r.id)}" class="btn btn-primary">View Details</a>`;
        }
      });

      // Unread notification count on the nav link
      const nq = query(collection(db, "notifications"), where("user_email", "==", user.email.toLowerCase()));
      onSnapshot(nq, (snap) => {
        let unread = 0;
        snap.forEach(d => { if (!d.data().read_status) unread++; });
        const link = document.querySelector('a[href="notifications.html"]');
        if (link) link.textContent = `🔔 Notifications${unread ? ` (${unread})` : ""}`;
      });
    });
  </script>
</body>
</html>
