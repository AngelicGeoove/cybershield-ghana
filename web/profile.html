<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - CyberShield Ghana</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <main>
    <h2>Your Profile</h2>
    <div id="flash" class="alert d-none"></div>
    <div class="card" style="max-width:560px">
      <form id="profileForm">
        <div class="form-group"><label>Full name</label><input id="p_name" required></div>
        <div class="form-row">
          <div class="form-group"><label>Phone</label><input id="p_phone"></div>
          <div class="form-group"><label>Age</label><input id="p_age" type="number" min="1" max="120"></div>
        </div>
        <div class="form-group"><label>Location</label><input id="p_location"></div>
        <div class="form-group"><label>Organisation</label><input id="p_org"></div>
        <div class="form-group"><label>Email (cannot change)</label><input id="p_email" disabled></div>
        <button class="btn btn-primary" type="submit">Save changes</button>
      </form>
    </div>
  </main>
  <div class="footer">CyberShield Ghana &middot; <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a></div>

  <script type="module">
    import { auth, db, requireAuth, renderNav, showFlash } from "./js/common.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    requireAuth((user) => {
      renderNav("profile.html");
      document.getElementById("p_email").value = user.email;
      getDoc(doc(db, "users", user.email.toLowerCase())).then(snap => {
        if (!snap.exists()) return;
        const d = snap.data();
        document.getElementById("p_name").value = d.full_name || "";
        document.getElementById("p_phone").value = d.phone || "";
        document.getElementById("p_age").value = d.age || "";
        document.getElementById("p_location").value = d.location || "";
        document.getElementById("p_org").value = d.organisation || "";
      });

      document.getElementById("profileForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        await setDoc(doc(db, "users", user.email.toLowerCase()), {
          full_name: document.getElementById("p_name").value.trim(),
          phone: document.getElementById("p_phone").value.trim(),
          age: parseInt(document.getElementById("p_age").value) || null,
          location: document.getElementById("p_location").value.trim(),
          organisation: document.getElementById("p_org").value.trim(),
          updated_at: new Date()
        }, { merge: true });
        showFlash("Profile updated.", "success");
      });
    });
  </script>
</body>
</html>
