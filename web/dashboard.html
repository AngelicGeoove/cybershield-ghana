<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - CyberShield Ghana</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <main>
    <h2 id="greeting">Welcome</h2>
    <div id="flash" class="alert d-none"></div>

    <div class="stat-row" id="stats"></div>

    <div class="card">
      <div class="d-flex" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem">
        <h4 class="mb-0">Recent report</h4>
        <a class="btn btn-sm btn-primary" href="report.html">+ New Report</a>
      </div>
      <div id="recent" class="mt-3"></div>
    </div>

    <div class="card">
      <h4>Quick actions</h4>
      <div style="display:flex;gap:.75rem;flex-wrap:wrap">
        <a class="btn btn-outline" href="reports.html">Track my reports</a>
        <a class="btn btn-outline" href="notifications.html">Notifications</a>
        <a class="btn btn-outline" href="awareness.html">Stay Safe tips</a>
        <a class="btn btn-outline" href="channels.html">Contact the CSA</a>
      </div>
    </div>
  </main>
  <div class="footer">CyberShield Ghana &middot; <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a></div>

  <script type="module">
    import { auth, db, requireAuth, renderNav, fmtDate, statusBadge, esc } from "./js/common.js";
    import { collection, query, where, onSnapshot, getDocs, limit, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    requireAuth((user) => {
      renderNav("dashboard.html");
      document.getElementById("greeting").textContent = "Welcome back";

      // Greeting with name
      const unsub = onSnapshot(doc(db, "users", user.email.toLowerCase()), (snap) => {
        if (snap.exists()) {
          const d = snap.data();
          document.getElementById("greeting").textContent =
            `Welcome back, ${d.full_name ? d.full_name.split(" ")[0] : "friend"} 👋`;
        }
      });

      // Stats + recent + notifications badge
      const q = query(collection(db, "incidents"), where("user_email", "==", user.email.toLowerCase()), orderBy("created_at", "desc"), limit(50));
      onSnapshot(q, (snap) => {
        const incidents = [];
        snap.forEach(doc => incidents.push({ id: doc.id, ...doc.data() }));
        const total = incidents.length;
        const submitted = incidents.filter(i => ["submitted", "under_investigation", "evidence_requested", "resolved"].includes(i.status)).length;
        const draft = incidents.filter(i => i.status === "draft").length;
        document.getElementById("stats").innerHTML = `
          <div class="stat-card"><div class="stat-number">${total}</div><div class="stat-label">Total Reports</div></div>
          <div class="stat-card"><div class="stat-number">${submitted}</div><div class="stat-label">Active / Resolved</div></div>
          <div class="stat-card"><div class="stat-number">${draft}</div><div class="stat-label">Drafts</div></div>`;

        const recent = document.getElementById("recent");
        if (incidents.length === 0) {
          recent.innerHTML = `<p class="text-muted mb-0">No reports yet. <a href="report.html">Report an incident</a> to get started.</p>`;
        } else {
          const first = incidents[0];
          recent.innerHTML = `
            <div class="thread-item">
              <strong><a href="reports.html?id=${encodeURIComponent(first.id)}">${esc(first.category)}</a></strong>
              ${statusBadge(first.status)}
              <div class="small text-muted">Ref: ${esc(first.id)} &middot; ${fmtDate(first.created_at)}</div>
              <p class="mb-0 small">${esc((first.description || "").slice(0, 160))}</p>
            </div>`;
        }
      });

      // Unread notifications badge in nav
      const nq = query(collection(db, "notifications"), where("user_email", "==", user.email.toLowerCase()));
      onSnapshot(nq, (snap) => {
        let unread = 0;
        snap.forEach(d => { if (!d.data().read_status) unread++; });
        const link = document.querySelector('.nav-links a[href="notifications.html"]');
        if (link) link.textContent = `Notifications${unread ? ` (${unread})` : ""}`;
      });
    });
  </script>
</body>
</html>
